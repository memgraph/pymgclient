name: Release


on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      publish_doc:
        description: 'If set to true, then the documentation will be published.'
        default: false
        required: false
        type: boolean
      publish_pypi:
        default: false
        type: boolean
        description: "Attempt to publish packages to PyPI"
      test:
        default: true
        description: "Run test release (no docs, publish to test.pypi.org)"
        type: boolean


env:
  PYMGCLIENT_OVERRIDE_VERSION: "${{ github.event.inputs.version }}"

jobs:
  release_tests:
    name: Release Package and Test
    uses: "./.github/workflows/reusable_buildtest.yml"
    with:
      test_linux: true
      test_windows: true
      test_macintosh: true
      upload_artifacts: true
      version: ${{ inputs.version }}
    secrets: inherit

  build_docs:
    needs: [release_tests]
    name: Build Docs
    uses: "./.github/workflows/build_docs.yml"
    with:
      publish_doc: false
    secrets: inherit

  publish_artifacts:
    name: Collect Artifacts
    runs-on: ubuntu-24.04
    needs: [release_tests, build_docs]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # Fetch every package artifact uploaded earlier.
          pattern: pymgclient-*
          path: ./downloaded-artifacts

      - name: Move Artifacts
        run: |
          mkdir -p dist
          # Move all wheel files (unique per platform)
          find downloaded-artifacts -name "*.whl" -exec mv -fv {} dist/ \;
          # Move one tar.gz file (source distribution is identical across platforms)
          tar_gz=$(find downloaded-artifacts -name "*.tar.gz" | head -n 1)
          if [ -n "$tar_gz" ]; then
            mv -fv "$tar_gz" dist/
          fi

      - name: Show contents
        run: |
          ls dist/
      
      - name: Publish Package to PyPI
        if: ${{ inputs.publish_pypi == true && inputs.test == false }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish Package to PyPI (TEST)
        if: ${{ inputs.publish_pypi == true && inputs.test }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true